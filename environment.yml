# Python environment for the whole repository (CNN inference, analysis, figures, supplementary PDF).
# UMPA is installed from source: pip install git+https://github.com/optimato/UMPA  (v0.2 was used; Cython build).
name: cnn_sm
channels: [conda-forge, defaults]
dependencies:
  - python=3.10
  - numpy=2.2
  - scipy=1.15
  - matplotlib=3.10
  - reportlab
  - tifffile
  - scikit-image      # imported by ESPINNet's estimate_single.py
  - pip
  - pip:
      - torch==2.7.1        # CPU build is enough
      # - xraylib           # optional: only to recompute the attenuation table of gt_shepp_logan.py
      # - spekpy            # optional: only to recompute data/spectrum
